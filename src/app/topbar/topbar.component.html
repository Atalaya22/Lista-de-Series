<header class="topbar">
  <div class="brand">
    <div class="brand-mark">DP</div>
    <div>
      <p class="brand-title">Diario de Pantalla</p>
      <p class="brand-subtitle">Peliculas y series que dejan huella.</p>
    </div>
  </div>
  <nav class="nav">
    <button
      class="nav-pill"
      [class.active]="activeView === 'diario'"
      type="button"
      (click)="selectView('diario')"
    >
      Diario
    </button>
    <button
      class="nav-pill"
      [class.active]="activeView === 'estadisticas'"
      type="button"
      (click)="selectView('estadisticas')"
    >
      Estadisticas
    </button>
    <button class="nav-pill" type="button">Listas</button>
    <button class="nav-pill ghost" type="button">Exportar</button>
  </nav>
</header>
