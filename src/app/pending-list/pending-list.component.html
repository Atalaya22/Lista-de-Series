<div class="list-card">
  <p class="section-title">{{ title }}</p>

  <!-- Estado vacio cuando no hay pendientes -->
  @if (items.length === 0) {
    <p class="empty-message">No hay entrada</p>
  } @else {
    <!-- Lista de pendientes con accion de descarte -->
    @for (item of items; track item.title; let index = $index) {
      <div class="list-item">
        <div>
          <p>{{ item.title }}</p>
        </div>
        <button class="ghost" type="button" (click)="discard.emit(index)">Descartar</button>
      </div>
    }
  }
</div>
